<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Balloon Buster</title>
<meta name="description" content="A retro pixel-art balloon-popping arcade game, inspired by classic Pang-style gameplay.">

<!-- Installable as an app (see manifest.webmanifest, js/pwa.js and
     service-worker.js). Every path here is relative on purpose: a GitHub
     Pages project site serves the game from /<repo>/, not from the
     domain root. theme-color is the same near-black the HUD strip and the
     page background use, so the system bars match the game rather than
     framing it in white. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05040a">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<!-- iOS has no manifest support worth the name: these are how an iPhone
     is told the same things (run without Safari's chrome, name it, and
     keep the status bar dark). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balloons">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
<script src="js/vendor/phaser.min.js"></script>
</head>
<body>
<div id="game-shell">
  <div id="tool-bar">
    <div id="debug-panel" class="hidden"></div>
  </div>
  <div id="game-container">
    <div id="ui-layer">
    <!-- Starts hidden so it can't sit over the loading screen (see
         BootScene.showLoadingScreen) with its near-opaque .screen backdrop
         dimming it. ui.js's first render() reveals it the moment the game
         reaches MENU, which is exactly when loading has finished. -->
    <div id="screen-menu" class="screen hidden">
      <h1 id="game-title"><div id="game-title-line1"></div><div id="game-title-line2"></div></h1>
      <button id="btn-play" class="menu-btn"></button>
      <button id="btn-highscores" class="menu-btn"></button>
      <button id="btn-options" class="menu-btn"></button>
      <!-- Only for someone logged into the admin tool, which is the only
           place an edited level can actually be saved (see
           js/levelFile.js). Revealed by ui.js once that has answered. -->
      <button id="btn-editor" class="menu-btn hidden"></button>
      <!-- Only when running as an installed app: a browser tab is not
           allowed to close itself, so in one this would be a button that
           does nothing (see ui.js's revealQuitWhenInstalled). -->
      <button id="btn-quit-game" class="menu-btn hidden"></button>
      <p id="quit-hint" class="hint hidden"></p>
      <!-- Both start hidden and are revealed by js/pwa.js's rules: the
           button only once the browser has offered an install prompt, the
           iOS line only on an iPhone/iPad that is not already running the
           game from its home screen. -->
      <button id="btn-install" class="menu-btn hidden"></button>
      <p id="ios-install-hint" class="hint hidden"></p>
    </div>

    <!-- The three ways to play, each said out loud: three buttons on the
         main menu named them but did not explain them, and "PANIC MODE"
         tells a first-time player nothing at all. -->
    <div id="screen-play" class="screen hidden">
      <h2 id="play-title"></h2>
      <button id="btn-start" class="menu-btn menu-card">
        <span id="start-name"></span>
        <span id="start-hint" class="card-hint"></span>
      </button>
      <button id="btn-start-panic" class="menu-btn menu-card">
        <span id="start-panic-name"></span>
        <span id="start-panic-hint" class="card-hint"></span>
      </button>
      <button id="btn-start-level" class="menu-btn menu-card">
        <span id="start-level-name"></span>
        <span id="start-level-hint" class="card-hint"></span>
      </button>
      <button id="btn-close-play" class="menu-btn"></button>
    </div>

    <div id="screen-options" class="screen hidden">
      <h2 id="options-title"></h2>
      <button id="btn-sound" class="menu-btn"></button>
      <button id="btn-display" class="menu-btn"></button>
      <button id="btn-controls" class="menu-btn"></button>
      <button id="btn-erase" class="menu-btn"></button>
      <button id="btn-close-options" class="menu-btn"></button>
    </div>

    <div id="screen-sound" class="screen hidden">
      <h2 id="sound-title"></h2>
      <div class="settings-group">
        <label><input type="checkbox" id="chk-mute"><span id="chk-mute-label"></span></label>
        <label><span id="rng-sfx-label"></span><input type="range" id="rng-sfx" min="0" max="1" step="0.05"></label>
        <label><span id="rng-music-label"></span><input type="range" id="rng-music" min="0" max="1" step="0.05"></label>
      </div>
      <button id="btn-close-sound" class="menu-btn"></button>
    </div>

    <div id="screen-display" class="screen hidden">
      <h2 id="display-title"></h2>
      <div class="settings-group">
        <div id="zoom-row">
          <span id="zoom-label"></span>
          <button id="btn-zoom-half" class="menu-btn zoom-btn"></button>
          <button id="btn-zoom-1x" class="menu-btn zoom-btn"></button>
          <button id="btn-zoom-2x" class="menu-btn zoom-btn"></button>
          <button id="btn-zoom-fit" class="menu-btn zoom-btn"></button>
        </div>
        <!-- One button per available skin, built by ui.js from the skin
             registry (js/skins.js) -- hidden entirely when only one skin
             exists, since a choice of one is not a choice. -->
        <div id="skin-row" class="hidden">
          <span id="skin-label"></span>
          <span id="skin-buttons"></span>
        </div>
        <button id="btn-options-fullscreen" class="menu-btn"></button>
      </div>
      <button id="btn-close-display" class="menu-btn"></button>
    </div>

    <!-- Erasing is irreversible, so the door does not do it: opening this
         screen only shows what would be lost, and the two answers are
         side by side under it. -->
    <div id="screen-erase" class="screen hidden">
      <h2 id="erase-title"></h2>
      <p id="erase-warning"></p>
      <button id="btn-erase-yes" class="menu-btn"></button>
      <button id="btn-close-erase" class="menu-btn"></button>
      <p id="erase-done" class="hint hidden"></p>
    </div>

    <div id="screen-keys" class="screen hidden">
      <h2 id="keys-title"></h2>
      <div id="keys-list"></div>
      <button id="btn-close-keys" class="menu-btn"></button>
    </div>

    <div id="screen-level-select" class="screen hidden">
      <h2 id="level-select-title"></h2>
      <div id="level-select-list"></div>
      <button id="btn-close-level-select" class="menu-btn"></button>
    </div>

    <div id="screen-pause" class="screen hidden">
      <h2 id="pause-title"></h2>
      <button id="btn-resume" class="menu-btn"></button>
      <button id="btn-pause-restart" class="menu-btn hidden"></button>
      <button id="btn-pause-editor" class="menu-btn hidden"></button>
      <button id="btn-quit" class="menu-btn"></button>
    </div>

    <div id="screen-game-over" class="screen hidden">
      <h2 id="gameover-title"></h2>
      <p id="final-score"></p>
      <button id="btn-restart" class="menu-btn"></button>
      <button id="btn-menu" class="menu-btn"></button>
    </div>

    <div id="screen-victory" class="screen hidden">
      <h2 id="victory-title"></h2>
      <p id="victory-score"></p>
      <button id="btn-victory-restart" class="menu-btn"></button>
      <button id="btn-victory-menu" class="menu-btn"></button>
    </div>

    <div id="screen-high-score-entry" class="screen hidden">
      <h2 id="entry-title"></h2>
      <p id="entry-score"></p>
      <input id="entry-name" maxlength="3" autocomplete="off" spellcheck="false">
      <button id="btn-submit-score" class="menu-btn"></button>
    </div>

    <div id="screen-high-scores" class="screen hidden">
      <h2 id="highscores-title"></h2>
      <ol id="high-score-list"></ol>
      <button id="btn-close-highscores" class="menu-btn"></button>
    </div>

    <div id="touch-controls" class="hidden">
      <button id="btn-pause-touch" class="touch-btn touch-btn-small" aria-label="Pause">&#10073;&#10073;</button>
      <div id="touch-joystick" role="group" aria-label="Move">
        <div id="touch-joystick-knob"></div>
      </div>
      <button id="btn-shoot" class="touch-btn touch-btn-primary" aria-label="Shoot">&#9650;</button>
    </div>
  </div>
  <!-- The level editor's controls, over the canvas's HUD strip (see
       style.css / editor.js's buildPanel) rather than in #tool-bar above
       the canvas. A sibling of #ui-layer, not one of its screens: it is
       not part of the menu flow and is shown/hidden by the editor alone. -->
  <div id="editor-panel" class="hidden"></div>
</div>
</div>
<!-- Covers the whole screen, not just the canvas, and only ever on a
     phone held upright (see style.css: body.is-touch + a portrait media
     query). The playfield is wider than it is tall and there is no
     portrait layout of it worth having, so this asks for the phone to be
     turned rather than shrinking the game into a strip. -->
<div id="rotate-prompt" aria-live="polite">
  <div id="rotate-prompt-icon" aria-hidden="true"></div>
  <div id="rotate-prompt-text"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
